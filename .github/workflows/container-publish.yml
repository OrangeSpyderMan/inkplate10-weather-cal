name: Publish Container Image

on:
  push:
    branches:
      - main
      - next
    tags:
      - "v*"
    paths:
      - "server/**"
      - "Dockerfile"
      - "Dockerfile.weatherproxy"
      - "pyproject.toml"
      - "bin/build_weather_proxy.py"
      - "docs/weather-proxy.md"
      - "bin/generate_version_manifest.py"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/orangespyderman/inkplate10-weather-cal

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: calendar
            image: ghcr.io/orangespyderman/inkplate10-weather-cal
            dockerfile: Dockerfile
          - component: weatherproxy
            image: ghcr.io/orangespyderman/weatherproxy
            dockerfile: Dockerfile.weatherproxy
    env:
      IMAGE_NAME: ${{ matrix.image }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/next' }}
            type=ref,event=tag

      - name: Generate version manifest
        id: version
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="$(python3 bin/generate_version_manifest.py --build-date "$build_date")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}

  python-distributions:
    name: Build WeatherProxy Python assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel and source distribution
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          python3 -m pip install build packaging
          if [ "$RELEASE_TYPE" = tag ]; then
            version="$RELEASE_REF"
          else
            version="4.2.0.dev${GITHUB_RUN_NUMBER}"
          fi
          python3 bin/build_weather_proxy.py --version "$version"
      - name: Store Python assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weatherproxy-python
          path: dist/weatherproxy/*
      - name: Attach Python assets to existing release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/weatherproxy/* --clobber
